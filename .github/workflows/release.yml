# Build the addin for MPC OS Gen1 (armv7) and Gen2 (aarch64) and attach both zips to a DRAFT release, with
# mpc-vst-plugins' reusable workflow (its docs/ADDINS.md, "Releasing from CI"). mpc-vst-plugins is pinned to ONE commit
# in both places below. It is the head of sd88me/mpc-vst-plugins#512 (Gen2 addins), as in mpc-addin-commander: move
# both pins to a main commit once that is merged.
# Run it from the Actions tab or `gh workflow run release.yml -f version=<x.y.z>`, then publish the draft
# (as a prerelease while the version is 0.x).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for the zips, addin.manifest and INSTALL.md, e.g. 0.1.0
        required: true
        type: string
      dry_run:
        description: Build and package only (the zips as run artifacts, no draft release)
        type: boolean
        default: false

jobs:
  addin:
    uses: sd88me/mpc-vst-plugins/.github/workflows/addin-release.yml@1acb45cb9a327cc861d8ea29c95b1cb068f568e2
    permissions: { contents: write }
    with:
      tag: filebrowser-addin-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 1acb45cb9a327cc861d8ea29c95b1cb068f568e2
      package_dir: build
      build: ./build.sh armv7
      package_dir_aarch64: build/aarch64
      build_aarch64: ./build.sh aarch64
      host_test: tests/test.sh && tests/smoke.sh armv7 && tests/smoke.sh aarch64
      about: "FileBrowser Quantum beside MPC: browse, upload and download the device's drives in a web browser (through an SSH tunnel by default)."
      license: MIT AND Apache-2.0
      dry_run: ${{ inputs.dry_run }}
