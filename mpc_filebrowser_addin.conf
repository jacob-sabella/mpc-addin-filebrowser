# mpc-addin-filebrowser settings (key=value; this file sits next to mpc_filebrowser_addin.so). Read when MPC starts.
# The addin runs FileBrowser Quantum beside MPC, while MPC runs, and stops it when MPC exits.
enabled=1
# The address FileBrowser listens on. 127.0.0.1: this device only, reached through an SSH tunnel
# (ssh -N -L 6740:127.0.0.1:6740 root@<device>, then http://localhost:6740). 0.0.0.0: every network the device is on;
# anyone who can reach the port can then try to log in, and an admin can read, change and delete any file in sources.
bind=127.0.0.1
port=6740
# The folders it shows, split by ':' (absolute paths; no " or \ in them). One that doesn't exist or is empty (a mount
# point with nothing mounted) is skipped, at each MPC start. /media holds the internal drive (Gen1) and every SD card and
# USB drive (Gen1 and Gen2); /storage is the internal storage on devices whose MPC OS mounts it there.
sources=/media:/storage
# index=1 builds a search index of the folders (a full disk scan at each start, then periodic rescans). Off by
# default: the scan competes with MPC for the disk. Without it, browsing, uploads and downloads still work.
index=0
# Image thumbnails (0 turns them off).
previews=1
# FileBrowser's nice value (0..19, higher is gentler). It also always runs in the idle disk class.
nice=19
# A soft memory limit for FileBrowser, in MB.
memory_mb=192
# A file to append FileBrowser's and the addin's log to (an absolute path; empty: no log).
log=
# A FileBrowser config file of your own, used instead of the one made from this file (bind, port, sources, index and
# previews above are then ignored). Empty: the one made from this file.
config=
